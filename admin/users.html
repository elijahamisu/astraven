<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    .search-filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid #D1D5DB; border-radius: var(--radius-sm); font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Member Accounts</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">User Directory</h1>
      </div>

      <div class="search-filter-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by username, name, phone, or referral code...">
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="usersContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading investor accounts...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatDate } from '../shared/formatters.js';

    let allUsers = [];

    async function loadUsers() {
      const auth = await initAdminNavigation();
      if (!auth) return;

      const container = document.getElementById('usersContainer');
      const input = document.getElementById('searchInput');
      let timer = null, seq = 0;

      async function fetchUsers(q) {
        const mySeq = ++seq;
        let query = supabase
          .from('profiles')
          .select(`id, username, full_name, phone, referral_code, is_suspended, created_at`)
          .order('created_at', { ascending: false });
        const term = (q || '').trim().replace(/^@+/, '').replace(/[,()*%\\]/g, ' ').trim();
        if (term) {
          const like = `%${term}%`;
          query = query.or(`username.ilike.${like},full_name.ilike.${like},phone.ilike.${like},referral_code.ilike.${like}`).limit(200);
        } else {
          query = query.limit(100);
        }
        const { data: users, error } = await query;
        if (mySeq !== seq) return; // a newer search finished first
        if (error) {
          container.innerHTML = `<p style="text-align: center; color: #B91C1C; padding: 40px;">Could not load users: ${error.message}</p>`;
          return;
        }
        if (!users || users.length === 0) {
          container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">${term ? 'No user matches "' + term.replace(/</g,'&lt;') + '".' : 'No registered accounts found.'}</p>`;
          return;
        }
        allUsers = users;
        render(allUsers);
      }

      input.addEventListener('input', (e) => {
        clearTimeout(timer);
        timer = setTimeout(() => fetchUsers(e.target.value), 300);
      });

      await fetchUsers('');
    }

    function render(list) {
      const container = document.getElementById('usersContainer');
      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">User</th>
              <th style="padding: 12px;">Phone</th>
              <th style="padding: 12px;">Referral Code</th>
              <th style="padding: 12px;">Registered</th>
              <th style="padding: 12px;">Status</th>
              <th style="padding: 12px;">Action</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(u => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px;">
                  <strong style="color: var(--deep-forest);">@${u.username}</strong>
                  <div style="font-size: 0.75rem; color: var(--secondary-text);">${u.full_name || '—'}</div>
                </td>
                <td style="padding: 12px;">${u.phone || '—'}</td>
                <td style="padding: 12px; font-family: monospace; font-weight: 700; color: var(--metallic-gold);">${u.referral_code}</td>
                <td style="padding: 12px; color: var(--secondary-text); font-size: 0.75rem;">${formatDate(u.created_at, { includeTime: false })}</td>
                <td style="padding: 12px;">
                  <span class="badge-status ${u.is_suspended ? 'badge-failed' : 'badge-completed'}">
                    ${u.is_suspended ? 'Suspended' : 'Active'}
                  </span>
                </td>
                <td style="padding: 12px;">
                  <a href="/admin/user-details.html?id=${u.id}" class="btn-emerald" style="padding: 6px 12px; font-size: 0.75rem; text-decoration: none;">Inspect Profile</a>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    loadUsers();
  </script>
</body>
</html>
